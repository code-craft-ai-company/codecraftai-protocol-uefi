[tool.poetry]
name = "codecraftai-protocol-uefi"
description = "Code Craft AI - UEFI Protocol Interop Library"
version = "0.0.1"
authors = ["Myron Walker <myron.walker@gmail.com>"]
readme = "README.rst"
license = "LicenseRef-CodeCraftAI-Dual-License"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: Other/Proprietary License",
    "Operating System :: POSIX"
]
keywords = [
    "python",
    "uefi",
    "firmware",
    "interop",
    "automation"
]
packages = [{include="ccai", from="source/packages"}]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
cryptography = "^46.0.5"
pyserial = "^3.5"
requests = "^2.32.0"
codecraftai-errors = { git = "https://github.com/code-craft-ai-company/codecraftai-errors.git", branch = "main" }
codecraftai-credentials = { git = "https://github.com/code-craft-ai-company/codecraftai-credentials.git", branch = "main" }
codecraftai-xmodules = { git = "https://github.com/code-craft-ai-company/codecraftai-xmodules.git", branch = "main" }
# codecraftai-protocol-ssh is an OPTIONAL runtime dependency used only by the
# UefiSshHostTransport; it has a transitive dep on codecraftai-interop that
# conflicts with cryptography pinning in this project. When absent,
# UefiSshHostTransport construction raises ConfigurationError. Install
# separately in downstream projects that need the ssh-host transport:
#   pip install codecraftai-protocol-ssh codecraftai-interop

[tool.poetry.group.dev.dependencies]

[tool.poetry.group.dbio.dependencies]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
